#
# A route graph (--route-graph) for the open ks floor, which has no racks: its points as lanes.
# The dock row (y 2.1) and the north edge (y 19), joined by aisles 1-4 (x 3, 9, 15, 21); spurs
# reach charging-bay, corner-sw and staging-shelf-a. No cross-aisle: aisle to aisle goes round
# by the dock row or the north edge. The route graph's tests use it. For the warehouse world,
# with its racks, use warehouse-lanes.yaml.
nodes:
  dock-row-west: [-4.0, 2.1]
  dock-row-east: [24.0, 2.1]
  charge-spur: [1.1, 2.1]
  shelf-spur: [12.1, 2.1]
  receiving-dock-1: [5.1, 2.1]
  receiving-dock-2: [9.1, 2.1]
  receiving-dock-3: [13.1, 2.1]
  receiving-dock-4: [17.1, 2.1]
  receiving-dock-5: [21.1, 2.1]
  aisle-1-dock: [3.0, 2.1]
  aisle-2-dock: [9.0, 2.1]
  aisle-3-dock: [15.0, 2.1]
  aisle-4-dock: [21.0, 2.1]
  corner-nw: [-4.0, 19.0]
  corner-ne: [24.0, 19.0]
  aisle-1-top: [3.0, 19.0]
  aisle-2-top: [9.0, 19.0]
  aisle-3-top: [15.0, 19.0]
  aisle-4-top: [21.0, 19.0]
  aisle-1-south: [3.0, 7.0]
  aisle-1-middle: [3.0, 11.5]
  aisle-1-north: [3.0, 16.0]
  aisle-2-south: [9.0, 7.0]
  aisle-2-middle: [9.0, 11.5]
  aisle-2-north: [9.0, 16.0]
  aisle-3-south: [15.0, 7.0]
  aisle-3-middle: [15.0, 11.5]
  aisle-3-north: [15.0, 16.0]
  aisle-4-south: [21.0, 7.0]
  aisle-4-middle: [21.0, 11.5]
  aisle-4-north: [21.0, 16.0]
  charging-bay: [1.1, 1.1]
  corner-sw: [-4.0, -4.0]
  staging-shelf-a: [12.1, 8.1]
edges:
  - [dock-row-west, charge-spur]
  - [charge-spur, aisle-1-dock]
  - [aisle-1-dock, receiving-dock-1]
  - [receiving-dock-1, aisle-2-dock]
  - [aisle-2-dock, receiving-dock-2]
  - [receiving-dock-2, shelf-spur]
  - [shelf-spur, receiving-dock-3]
  - [receiving-dock-3, aisle-3-dock]
  - [aisle-3-dock, receiving-dock-4]
  - [receiving-dock-4, aisle-4-dock]
  - [aisle-4-dock, receiving-dock-5]
  - [receiving-dock-5, dock-row-east]
  - [corner-nw, aisle-1-top]
  - [aisle-1-top, aisle-2-top]
  - [aisle-2-top, aisle-3-top]
  - [aisle-3-top, aisle-4-top]
  - [aisle-4-top, corner-ne]
  - [aisle-1-dock, aisle-1-south]
  - [aisle-1-south, aisle-1-middle]
  - [aisle-1-middle, aisle-1-north]
  - [aisle-1-north, aisle-1-top]
  - [aisle-2-dock, aisle-2-south]
  - [aisle-2-south, aisle-2-middle]
  - [aisle-2-middle, aisle-2-north]
  - [aisle-2-north, aisle-2-top]
  - [aisle-3-dock, aisle-3-south]
  - [aisle-3-south, aisle-3-middle]
  - [aisle-3-middle, aisle-3-north]
  - [aisle-3-north, aisle-3-top]
  - [aisle-4-dock, aisle-4-south]
  - [aisle-4-south, aisle-4-middle]
  - [aisle-4-middle, aisle-4-north]
  - [aisle-4-north, aisle-4-top]
  - [charging-bay, charge-spur]
  - [corner-sw, dock-row-west]
  - [staging-shelf-a, shelf-spur]
