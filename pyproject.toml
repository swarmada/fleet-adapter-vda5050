[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-adapter-vda5050"
version = "1.4.2"
description = "VDA5050 Fleet Adapter — a Swarmada Fleet Adapter for the VDA5050 robot class"
authors = [{ name = "The Swarmada Authors" }]
license = { text = "Apache-2.0" }
# Aligned with swarmada-sdk, which this adapter depends on and which now requires >=3.12. The
# adapter's own dependencies (grpcio, protobuf) still support 3.10; the floor is inherited from the
# SDK rather than imposed by anything here.
requires-python = ">=3.12"
dependencies = [
  # The audited safety primitives (C3/C4/C5) — never re-implement them.
  "swarmada-sdk",
  "grpcio>=1.64.1",  # the vendored stubs are generated by grpcio-tools 1.64.1 and refuse older
  "protobuf>=4.25",
  "pyyaml>=6.0",  # simulated-comms scenario presets (--scenario)
]

[project.optional-dependencies]
# The MQTT transport for --comms vda5050. Optional: --comms simulated needs none.
# Held to paho-mqtt 2.1: a cancel is confirmed only once MQTTMessageInfo.is_published() answers
# True (the broker's PUBACK), as paho 2.1 answers it. Widen it only after checking that answer.
vda5050 = ["paho-mqtt>=2.1,<2.2"]  # callback API version 2 (mqtt_client.py)
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
fleet-adapter-vda5050 = "fleet_adapter_vda5050.adapter:main"

[tool.setuptools.packages.find]
include = ["fleet_adapter_vda5050*"]

# The scenario presets --scenario names (healthy-fleet is the default): without them an
# installed adapter, the image's, stops at start-up on an unknown scenario.
[tool.setuptools.package-data]
"fleet_adapter_vda5050.scenarios" = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
